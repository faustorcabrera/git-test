name: Lurion Local CI

run-name: Lurion CI | PR #${{ inputs.pr_number }} | ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Lurion pull request number
        required: true
        type: string
      base_sha:
        description: Exact Lurion PR base SHA
        required: true
        type: string
      source_sha:
        description: Exact Lurion PR head SHA
        required: true
        type: string
      source_tree:
        description: Exact Lurion PR head tree
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lurion-local-ci
  cancel-in-progress: false

jobs:
  check:
    runs-on:
      - self-hosted
      - lurion-ci
    timeout-minutes: 120
    env:
      LURION_REPO: /Users/faustocabrera/repos/Lurion
      PR_NUMBER: ${{ inputs.pr_number }}
      BASE_SHA: ${{ inputs.base_sha }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      SOURCE_TREE: ${{ inputs.source_tree }}
    steps:
      - name: Prepare exact Lurion checkout
        id: prepare
        shell: bash
        run: |
          set -euo pipefail

          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "Invalid PR number"; exit 2; }
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid base SHA"; exit 2; }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid source SHA"; exit 2; }
          [[ "$SOURCE_TREE" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid source tree"; exit 2; }

          git -C "$LURION_REPO" rev-parse --git-dir >/dev/null
          git -C "$LURION_REPO" fetch origin --prune
          git -C "$LURION_REPO" cat-file -e "${BASE_SHA}^{commit}"
          git -C "$LURION_REPO" cat-file -e "${SOURCE_SHA}^{commit}"
          git -C "$LURION_REPO" merge-base --is-ancestor "$BASE_SHA" "$SOURCE_SHA"

          actual_tree="$(git -C "$LURION_REPO" show -s --format=%T "$SOURCE_SHA")"
          [[ "$actual_tree" == "$SOURCE_TREE" ]] || {
            echo "Tree mismatch: expected $SOURCE_TREE, got $actual_tree"
            exit 3
          }

          worktree="$RUNNER_TEMP/lurion-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$worktree"
          git -C "$LURION_REPO" worktree add --detach "$worktree" "$SOURCE_SHA"

          if [[ -f "$LURION_REPO/.env.local" ]]; then
            cp "$LURION_REPO/.env.local" "$worktree/.env.local"
            chmod 600 "$worktree/.env.local"
          fi

          {
            echo "worktree=$worktree"
            echo "actual_tree=$actual_tree"
          } >> "$GITHUB_OUTPUT"

          echo "Prepared Lurion PR #$PR_NUMBER at $SOURCE_SHA / $actual_tree"

      - name: Run exact-head validation
        shell: bash
        env:
          WORKTREE: ${{ steps.prepare.outputs.worktree }}
          ACTUAL_TREE: ${{ steps.prepare.outputs.actual_tree }}
        run: |
          set -u

          log="$RUNNER_TEMP/lurion-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          cd "$WORKTREE"

          set +e
          (
            npm ci
            LURION_VERSION_BASE_REF="$BASE_SHA" npm run check
            npm audit --audit-level=moderate
            git diff --check "$BASE_SHA...$SOURCE_SHA"
          ) >"$log" 2>&1
          status=$?
          set -e

          log_sha256="$(shasum -a 256 "$log" | awk '{print $1}')"
          echo "Lurion PR: #$PR_NUMBER"
          echo "Base SHA: $BASE_SHA"
          echo "Head SHA: $SOURCE_SHA"
          echo "Head tree: $ACTUAL_TREE"
          echo "Validation log SHA-256: $log_sha256"
          echo "Private local log: $log"

          if [[ $status -ne 0 ]]; then
            echo "Exact-head validation failed. Inspect the private local log on the runner."
            exit "$status"
          fi

          echo "Exact-head validation passed."

      - name: Remove disposable checkout
        if: always()
        shell: bash
        env:
          WORKTREE: ${{ steps.prepare.outputs.worktree }}
        run: |
          set +e
          if [[ -n "${WORKTREE:-}" ]]; then
            git -C "$LURION_REPO" worktree remove --force "$WORKTREE"
            rm -rf "$WORKTREE"
          fi
          git -C "$LURION_REPO" worktree prune
          exit 0
