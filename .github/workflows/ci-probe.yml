name: CI Probe

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on:
      - self-hosted
      - lurion-ci
    steps:
      - name: Confirm Actions control plane
        run: echo "GitHub Actions control plane is healthy"
